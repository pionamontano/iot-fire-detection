name: Firmware release

# Builds the ESP32 firmware and uploads firmware.bin to Supabase Storage for OTA.
# One image serves every node: device ID / API key are stored per node (NVS), not compiled in.
# It does NOT roll anything out: register the printed version/URL/MD5 in the admin
# Devices page (add release -> test on one device -> push to fleet).
#
# Trigger: push a tag like  firmware-v2.2.1  (the tag's version becomes FIRMWARE_VERSION),
# or run manually and give the version.
#
# Builds ONE PlatformIO env, by default esp32dev_mq7_5v: the constant-5V MQ-7 wiring every
# deployed node uses (see platformio.ini). esp32dev (heater-PWM wiring) can be chosen on a
# manual run. Flashing the build that does not match a node's wiring gives wrong CO readings.

on:
  push:
    tags: ['firmware-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version, e.g. 2.2.1 (no "v" prefix)'
        required: true
      env:
        description: 'PlatformIO env (must match the nodes'' MQ-7 wiring)'
        type: choice
        options: [esp32dev_mq7_5v, esp32dev]
        default: esp32dev_mq7_5v

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      # Supabase project (Settings -> API). SUPABASE_SERVICE_ROLE_KEY is used ONLY to upload to Storage;
      # it is never compiled into the firmware.
      SUPABASE_URL: ${{ secrets.FIRMWARE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FIRMWARE_SUPABASE_SERVICE_ROLE_KEY }}
      FIRMWARE_BUCKET: ${{ vars.FIRMWARE_BUCKET || 'firmware' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and env
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_ENV: ${{ github.event.inputs.env }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#firmware-v}"; else v="$INPUT_VERSION"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Invalid firmware version: '$v'"; exit 1
          fi
          e="${INPUT_ENV:-esp32dev_mq7_5v}"
          case "$e" in esp32dev_mq7_5v|esp32dev) ;; *) echo "Not a production env: '$e'"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "env=$e" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        run: |
          for n in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BUILD_ANON_KEY; do
            if [ -z "${!n}" ]; then echo "Missing secret for $n"; exit 1; fi
          done
        env:
          BUILD_ANON_KEY: ${{ secrets.FIRMWARE_SUPABASE_ANON_KEY }}

      - name: Host logic tests
        run: bash firmware/agapsense-firmware/host_tests/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/agapsense-firmware/platformio.ini') }}

      - run: pip install platformio

      - name: Generate config.h
        working-directory: firmware/agapsense-firmware/src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ANON_KEY: ${{ secrets.FIRMWARE_SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          s = open('config.example.h', encoding='utf-8').read()
          def setdef(s, name, value):
              pat = re.compile(r'^(#define\s+%s\s+)".*?"' % name, re.M)
              assert pat.search(s), name
              return pat.sub(lambda m: m.group(1) + '"' + value + '"', s, count=1)
          s = setdef(s, 'SUPABASE_URL', os.environ['SUPABASE_URL'])
          s = setdef(s, 'SUPABASE_ANON_KEY', os.environ['ANON_KEY'])
          s = setdef(s, 'FIRMWARE_VERSION', os.environ['VERSION'])
          open('config.h', 'w', encoding='utf-8').write(s)
          PY

      # Envs that set -D FIRMWARE_VERSION in platformio.ini (the esp32dev_mq7_5v family) override
      # config.h, so the tag's version must replace that flag too. Only this CI checkout is changed.
      - name: Apply version to the env's build flags
        working-directory: firmware/agapsense-firmware
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PIO_ENV: ${{ steps.ver.outputs.env }}
        run: |
          python3 - <<'PY'
          import os, re
          env, version = os.environ['PIO_ENV'], os.environ['VERSION']
          text = open('platformio.ini', encoding='utf-8').read()
          parts = re.split(r'(?m)^(?=\[)', text)
          head = '[env:%s]' % env
          hits = [i for i, p in enumerate(parts) if p.startswith(head + '\n') or p.startswith(head + '\r')]
          assert len(hits) == 1, 'env section not found: ' + env
          i = hits[0]
          # platformio.ini form:  -D FIRMWARE_VERSION='"2.2.0"'
          flag = re.compile(r"""(-D\s*FIRMWARE_VERSION=)'"[^"]*"'""")
          new, n = flag.subn(lambda m: m.group(1) + "'\"" + version + "\"'", parts[i])
          assert n <= 1, 'FIRMWARE_VERSION defined more than once in ' + head
          parts[i] = new
          open('platformio.ini', 'w', encoding='utf-8').write(''.join(parts))
          print(('set %s FIRMWARE_VERSION to %s' if n else '%s takes FIRMWARE_VERSION from config.h (%s)') % (head, version))
          PY

      # Only the chosen env: a bare `pio run` would also build test_components, which needs a
      # git-ignored secrets file.
      - name: Build
        working-directory: firmware/agapsense-firmware
        env:
          PIO_ENV: ${{ steps.ver.outputs.env }}
        run: pio run -e "$PIO_ENV"

      - name: Check the image reports the release version
        working-directory: firmware/agapsense-firmware
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PIO_ENV: ${{ steps.ver.outputs.env }}
        run: |
          # FIRMWARE_VERSION is compiled in as a string (telemetry + OTA comparison), so it must be in the image.
          if ! grep -aqF -- "${VERSION}" ".pio/build/${PIO_ENV}/firmware.bin"; then
            echo "Built image does not contain version ${VERSION}"; exit 1
          fi

      - name: Checksum
        id: sum
        working-directory: firmware/agapsense-firmware
        env:
          PIO_ENV: ${{ steps.ver.outputs.env }}
        run: |
          f=".pio/build/${PIO_ENV}/firmware.bin"
          test -s "$f"
          echo "md5=$(md5sum "$f" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$f")" >> "$GITHUB_OUTPUT"

      - name: Upload to Supabase Storage
        id: up
        working-directory: firmware/agapsense-firmware
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PIO_ENV: ${{ steps.ver.outputs.env }}
        run: |
          path="agapsense-${VERSION}-${PIO_ENV}.bin"
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/storage/v1/object/${FIRMWARE_BUCKET}/${path}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@.pio/build/${PIO_ENV}/firmware.bin")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Upload failed (HTTP $code) - an existing object with this version is never overwritten:"; cat resp.txt; exit 1
          fi
          echo "url=${SUPABASE_URL}/storage/v1/object/public/${FIRMWARE_BUCKET}/${path}" >> "$GITHUB_OUTPUT"

      - name: Verify the public URL serves the same bytes
        env:
          URL: ${{ steps.up.outputs.url }}
          MD5: ${{ steps.sum.outputs.md5 }}
        run: |
          curl -fsSL "$URL" -o dl.bin
          test "$(md5sum dl.bin | cut -d' ' -f1)" = "$MD5"

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PIO_ENV: ${{ steps.ver.outputs.env }}
          URL: ${{ steps.up.outputs.url }}
          MD5: ${{ steps.sum.outputs.md5 }}
          SIZE: ${{ steps.sum.outputs.size }}
        run: |
          {
            echo "### Firmware ${VERSION} uploaded"
            echo
            echo "Register this in the admin Devices page (add release), test on ONE device, then push to fleet."
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Build env | \`${PIO_ENV}\` (only for nodes with this MQ-7 wiring) |"
            echo "| URL | ${URL} |"
            echo "| MD5 | \`${MD5}\` |"
            echo "| Size | ${SIZE} bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
