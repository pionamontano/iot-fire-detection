; ============================================================
; AgapSense — IoT Fire Detection Node
; PlatformIO Project Configuration
; Target: ESP32 DevKit V1 (Espressif ESP32)
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

; ── Library Dependencies ───────────────────────────────────
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    ; Captive-portal Wi-Fi provisioning (first-boot AP mode)
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.0

; ── Build Flags ────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; -DDEBUG_MODE=1    ; uncomment to enable Serial debug logging

; ── Upload Settings ────────────────────────────────────────
upload_speed   = 921600
upload_port    = /dev/ttyUSB0    ; adjust for your OS (COMx on Windows)
