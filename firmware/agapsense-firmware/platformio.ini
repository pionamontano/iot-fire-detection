; ============================================================
; AgapSense — IoT Fire Detection Node
; PlatformIO Project Configuration
; Target: ESP32 DevKit V1 (Espressif ESP32)
; ============================================================

[env:esp32dev]
; Pinned: Arduino-ESP32 3.x (newer platform releases) removed ledcSetup/ledcAttachPin
; and the esp_task_wdt_init(sec, bool) signature this firmware uses.
platform  = espressif32 @ ~6.9.0
board     = esp32dev
framework = arduino

monitor_speed = 115200

; test_components.cpp is a separate standalone sketch (see env:test_components
; below) with its own setup()/loop() — excluded here so it can't collide with
; main.cpp's.
build_src_filter = +<*> -<test_components.cpp>

; ── Library Dependencies ───────────────────────────────────
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    ; Captive-portal Wi-Fi provisioning (first-boot AP mode)
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.0

; ── Build Flags ────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-extra-tokens
    ; -DDEBUG_MODE=1    ; uncomment to enable Serial debug logging

; ── Upload Settings ────────────────────────────────────────
upload_speed   = 921600
upload_port    = COM4    ; adjust for your OS (COMx on Windows)

; ── env:esp32dev_ota — production firmware, flashed over Wi-Fi ────
; The way back from test_components firmware to this one: once the
; board is running ANY firmware with ArduinoOTA listening (currently
; only test_components.cpp has it — main.cpp does not), ArduinoOTA
; will flash whatever valid .bin it's sent, regardless of which
; firmware built it. So reverting is a direct Wi-Fi push of the real
; production image — no Supabase Storage/DB involved.
;   pio run -e esp32dev_ota -t upload --upload-port <device-ip>
[env:esp32dev_ota]
extends          = env:esp32dev
upload_protocol  = espota
upload_port      = 0.0.0.0    ; always override with --upload-port <device-ip>

; ── env:esp32dev_mq7_5v — production firmware, MQ-7 constant-5V variant ───
; AGS-001's MQ-7 is wired to a constant 5V rail, not through MQ7_HEATER_PIN's
; PWM/transistor as the default env:esp32dev assumes (confirmed on hardware
; during bench testing — see sensors.cpp's #ifdef MQ7_CONTINUOUS_5V branch).
; Since every deployed node is wired this same way, this is the variant that
; actually belongs on real hardware; env:esp32dev's original duty-cycle
; behavior is kept as the default/fallback build, never silently changed.
; Reports its own FIRMWARE_VERSION so get-device-config's version check
; still behaves correctly for whichever variant is actually on the device.
;   pio run -e esp32dev_mq7_5v_ota -t upload --upload-port <device-ip>
[env:esp32dev_mq7_5v]
extends     = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-extra-tokens
    -DMQ7_CONTINUOUS_5V=1
    -D FIRMWARE_VERSION='"2.4.0"'

[env:esp32dev_mq7_5v_ota]
extends          = env:esp32dev_mq7_5v
upload_protocol  = espota
upload_port      = 0.0.0.0    ; always override with --upload-port <device-ip>

; ── env:esp32dev_mq7_5v_diag — adds a live HTTP log + ArduinoOTA ─────────
; Runs the REAL production firmware (MQ-7 fix included) but adds a
; /log live-updating viewer (see diag_server.cpp) fed by every module's
; existing LOG/CLOG/SLOG/GLOG/GSMLOG/ILOG macro, plus ArduinoOTA so you
; can reflash over Wi-Fi without USB — same two things test_components.cpp
; gives you, but on the actual firmware instead of a separate sketch.
;
; This adds an unauthenticated web server + an extra always-on FreeRTOS
; task to safety-critical fire-detection firmware. Meant for active bench
; debugging only — revert to env:esp32dev_mq7_5v (no diag server) once
; you're done, not left running unattended.
;   pio run -e esp32dev_mq7_5v_diag_ota -t upload --upload-port <device-ip>
; Dashboard: http://<device-ip>/log  or  http://agapsense-diag.local/log
[env:esp32dev_mq7_5v_diag]
extends     = env:esp32dev_mq7_5v
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-extra-tokens
    -DMQ7_CONTINUOUS_5V=1
    -D FIRMWARE_VERSION='"2.4.0-diag"'
    -DENABLE_DIAG_SERVER=1

[env:esp32dev_mq7_5v_diag_ota]
extends          = env:esp32dev_mq7_5v_diag
upload_protocol  = espota
upload_port      = 0.0.0.0    ; always override with --upload-port <device-ip>

; ============================================================
; env:test_components — Bench Hardware Test Harness
;
; Standalone sketch (src/test_components.cpp) that exercises every
; sensor/actuator and supports OTA reflash via ArduinoOTA (bundled with
; the espressif32 platform — no extra lib_dep needed). Never linked
; into env:esp32dev; build_src_filter excludes every other src/*.cpp
; so main.cpp's setup()/loop() can't collide with this one.
;
; First flash (USB, needs a working serial port):
;   pio run -e test_components -t upload
; Subsequent reflashes once it's running and on Wi-Fi (no cable, no
; working USB port required — uses env:test_components_ota below):
;   pio run -e test_components_ota -t upload --upload-port <device-ip>
;
; Wi-Fi/Telegram/SMS credentials live in src/config_test_secrets.h
; (gitignored) — copy config_test_secrets.example.h first.
; ============================================================
[env:test_components]
platform  = espressif32 @ ~6.9.0
board     = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter = -<*> +<test_components.cpp>

lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-extra-tokens

upload_speed = 921600
upload_port  = COM4    ; adjust for your OS — only used by this (USB) env

; ── env:test_components_ota — same firmware, flashed over Wi-Fi ───
; upload_protocol = espota is what actually makes --upload-port <ip>
; do a network flash instead of trying (and failing) to open a COM
; port. Only works once the board is already running test_components
; firmware (ArduinoOTA.begin() must have run) and is reachable on Wi-Fi.
[env:test_components_ota]
extends          = env:test_components
upload_protocol  = espota
upload_port      = 0.0.0.0    ; always override with --upload-port <device-ip>
